    <script>
      // Gracefully mock Vite dev HMR WebSocket connection in Cloud Run / iFrame proxy environments
      (function () {
        var OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;
        window.WebSocket = function (url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('ais-dev') || url.includes('token=')))) {
            return {
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              readyState: 1,
              send: function () {},
              close: function () {},
              addEventListener: function (event, handler) {
                if (event === 'open') {
                  setTimeout(handler, 0);
                }
              },
              removeEventListener: function () {},
              dispatchEvent: function () { return true; }
            };
          }
          return new OriginalWebSocket(url, protocols);
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        window.addEventListener('error', function (event) {
          if (event && (event.message?.includes('WebSocket') || event.error?.message?.includes('WebSocket'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function (event) {
          if (event && event.reason?.message?.includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        });
      })();
    </script>
